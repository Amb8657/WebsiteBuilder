name: Fix VisualBuilder compile imports
on:
  push:
    paths:
      - '.github/workflows/fix-visual-builder.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/amb8657/websitebuilder/VisualBuilderActivity.java')
          s = p.read_text()
          s = s.replace('import android.content.*;\n', 'import android.content.*;\nimport android.database.Cursor;\n')
          s = s.replace('import android.provider.OpenableColumns;\n', 'import android.provider.OpenableColumns;\nimport android.util.Base64;\n')
          s = s.replace('final int BG=Color.rgb(19,18,23),SOFT=', 'static final int BG=Color.rgb(19,18,23),SOFT=')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/amb8657/websitebuilder/VisualBuilderActivity.java
          git diff --cached --quiet || git commit -m 'Fix VisualBuilder compile imports'
          git push
