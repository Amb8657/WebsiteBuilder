name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gmail launcher and Option 2 source
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/res/drawable
          base64 -d app/src/main/assets/gmail.jpg.b64 > app/src/main/res/drawable/gmail.jpg
          sed -i 's/@drawable\/ic_maha/@drawable\/gmail/g' app/src/main/AndroidManifest.xml
          python3 .github/scripts/patch_option2.py
          grep -q 'postDelayed(this::dashboard,1800)' app/src/main/java/com/amb8657/websitebuilder/BuilderV3Activity.java
          grep -q 'animationDialog' app/src/main/java/com/amb8657/websitebuilder/BuilderV3Activity.java
      - name: Persist source changes
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/amb8657/websitebuilder/BuilderV3Activity.java app/src/main/AndroidManifest.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Implement Option 2 splash and interaction fixes [skip ci]'
            git push
          fi
      - name: Check Gradle installation
        run: gradle --version
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: maha-builder-debug-apk-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
