name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Gradle installation
        run: gradle --version
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: maha-builder-debug-apk-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
