name: Android Emulator QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Builder V3 on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            gradle assembleDebug --stacktrace -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
            gradle connectedDebugAndroidTest --stacktrace
            adb shell am force-stop com.amb8657.websitebuilder || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.amb8657.websitebuilder 1
            sleep 5
            adb exec-out screencap -p > builder-v3-launch.png
            adb logcat -d > builder-v3-logcat.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-qa-evidence-${{ github.run_number }}
          path: |
            builder-v3-launch.png
            builder-v3-logcat.txt
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
