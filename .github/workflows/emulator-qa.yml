name: Android Emulator QA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  emulator-qa:
    runs-on: macos-26-intel
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'

      - name: Run app on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: adb start-server
          script: |
            set -euxo pipefail
            cd "$GITHUB_WORKSPACE"
            gradle --no-daemon clean assembleDebug --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            adb shell am force-stop com.amb8657.websitebuilder || true
            adb shell am start -W -n com.amb8657.websitebuilder/.WebsiteBuilderV4Activity
            sleep 1
            echo '--- PROCESS AFTER 1 SECOND ---'
            adb shell pidof com.amb8657.websitebuilder
            sleep 3
            adb shell dumpsys activity activities > activity-dump.txt
            adb exec-out screencap -p > v4-launch.png
            adb logcat -d -v threadtime > v4-logcat.txt
            echo '--- WEBSITE BUILDER LOGS ---'
            grep -E -C 15 'FATAL EXCEPTION|AndroidRuntime|Process: com\.amb8657\.websitebuilder|com\.amb8657\.websitebuilder' v4-logcat.txt || true
            if grep -qE 'FATAL EXCEPTION|Process: com\.amb8657\.websitebuilder' v4-logcat.txt; then
              echo 'WebsiteBuilder crash detected'
              exit 1
            fi
            if ! adb shell pidof com.amb8657.websitebuilder >/dev/null; then
              echo 'WebsiteBuilder process is not running after launch'
              exit 1
            fi
            adb shell uiautomator dump /sdcard/v4-window.xml >/dev/null
            adb shell cat /sdcard/v4-window.xml > v4-window.xml
            grep -q 'Build something beautiful' v4-window.xml
            grep -q 'Create a website' v4-window.xml
            grep -q 'Quick add' v4-window.xml
            echo '--- LAUNCH QA PASSED ---'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-qa-evidence-${{ github.run_number }}
          path: |
            v4-launch.png
            v4-logcat.txt
            v4-window.xml
            activity-dump.txt
            app/build/outputs/**
