name: Android Emulator QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Canonical V4 verification workflow.
jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo "KVM available"
          else
            echo "KVM is unavailable on this runner; emulator may fall back to software acceleration"
          fi

      - name: Run canonical V4 on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics -no-snapshot-load -no-snapshot-save -accel auto
          disable-animations: true
          script: |
            set -euxo pipefail
            if [ -x ./gradlew ]; then
              ./gradlew --no-daemon clean assembleDebug connectedDebugAndroidTest --stacktrace
            else
              gradle --no-daemon clean assembleDebug connectedDebugAndroidTest --stacktrace
            fi

            adb wait-for-device
            for i in $(seq 1 60); do
              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              [ "$boot" = "1" ] && break
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            adb shell am force-stop com.amb8657.websitebuilder || true
            adb shell monkey -p com.amb8657.websitebuilder 1

            for i in $(seq 1 30); do
              if adb shell dumpsys activity activities 2>/dev/null | grep -q 'com.amb8657.websitebuilder/.WebsiteBuilderV4Activity'; then
                break
              fi
              sleep 1
            done
            adb shell dumpsys activity activities | grep -q 'com.amb8657.websitebuilder/.WebsiteBuilderV4Activity'

            adb exec-out screencap -p > v4-launch.png
            adb logcat -d > v4-logcat.txt

            if grep -qE 'FATAL EXCEPTION|Process: com\.amb8657\.websitebuilder' v4-logcat.txt; then
              echo 'WebsiteBuilder process crash detected:'
              grep -E -C 12 'FATAL EXCEPTION|Process: com\.amb8657\.websitebuilder' v4-logcat.txt || true
              exit 1
            fi

            adb shell uiautomator dump /sdcard/v4-window.xml >/dev/null
            adb shell cat /sdcard/v4-window.xml > v4-window.xml
            grep -q 'Build something beautiful' v4-window.xml
            grep -q 'Create a website' v4-window.xml
            grep -q 'Quick add' v4-window.xml

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-qa-evidence-${{ github.run_number }}
          path: |
            v4-launch.png
            v4-logcat.txt
            v4-window.xml
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
