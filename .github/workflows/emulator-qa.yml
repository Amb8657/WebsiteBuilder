name: Android Emulator QA

on:
  workflow_dispatch:
  push:
    branches: [main]

# Canonical V4 verification workflow.
# Uses the community-tested ReactiveCircus/android-emulator-runner action.
jobs:
  emulator-qa:
    runs-on: macos-26-intel
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'

      - name: Run canonical V4 on accelerated Android Emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: adb start-server
          script: |
            set -euxo pipefail
            cd "$GITHUB_WORKSPACE"

            gradle --no-daemon clean assembleDebug --stacktrace

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            adb shell am force-stop com.amb8657.websitebuilder || true

            adb shell am start -W -n com.amb8657.websitebuilder/.WebsiteBuilderV4Activity

            # Splash must remain visible long enough to be observable.
            sleep 1
            adb shell uiautomator dump /sdcard/v4-splash.xml >/dev/null
            adb shell cat /sdcard/v4-splash.xml > v4-splash.xml
            grep -q 'Gmail branding' v4-splash.xml

            sleep 2
            adb shell dumpsys activity activities > activity-dump.txt
            grep -q 'com.amb8657.websitebuilder/.WebsiteBuilderV4Activity' activity-dump.txt

            adb exec-out screencap -p > v4-launch.png
            adb logcat -d > v4-logcat.txt

            if grep -qE 'FATAL EXCEPTION|Process: com\.amb8657\.websitebuilder' v4-logcat.txt; then
              echo 'WebsiteBuilder process crash detected:'
              grep -E -C 12 'FATAL EXCEPTION|Process: com\.amb8657\.websitebuilder' v4-logcat.txt || true
              exit 1
            fi

            adb shell uiautomator dump /sdcard/v4-window.xml >/dev/null
            adb shell cat /sdcard/v4-window.xml > v4-window.xml
            grep -q 'Build something beautiful' v4-window.xml
            grep -q 'Create a website' v4-window.xml
            grep -q 'Quick add' v4-window.xml

            gradle --no-daemon connectedDebugAndroidTest --stacktrace

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-qa-evidence-${{ github.run_number }}
          path: |
            v4-splash.xml
            v4-launch.png
            v4-logcat.txt
            v4-window.xml
            activity-dump.txt
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**

# Community runner reference: https://github.com/ReactiveCircus/android-emulator-runner
