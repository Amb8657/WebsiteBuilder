name: Android Emulator QA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  emulator-qa:
    runs-on: macos-26-intel
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'

      - name: Select QA mode
        run: bash "$GITHUB_WORKSPACE/.github/workflows/qa-mode.sh"

      - name: Run Batch 1-4 cumulative contract audit
        run: bash "$GITHUB_WORKSPACE/.github/workflows/batch4-feature-audit.sh"

      - name: Run Batch 5 cumulative contract audit
        run: bash "$GITHUB_WORKSPACE/.github/workflows/batch5-feature-audit.sh"

      - name: Run Batch 6 cumulative contract audit
        run: bash "$GITHUB_WORKSPACE/.github/workflows/batch6-feature-audit.sh"

      - name: Run app on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: adb start-server
          script: bash "$GITHUB_WORKSPACE/.github/workflows/run-emulator-wrapper.sh"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-qa-evidence-${{ github.run_number }}
          path: |
            v4-launch.png
            v4-logcat.txt
            v4-window.xml
            activity-dump.txt
            qa-artifacts/**
            app/build/outputs/**
