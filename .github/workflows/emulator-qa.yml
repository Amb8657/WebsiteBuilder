name: Android Emulator QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'
      - name: Enable KVM
        run: |
          echo 'KERNEL="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run canonical V4 on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            set -e
            if [ -x ./gradlew ]; then ./gradlew assembleDebug connectedDebugAndroidTest --stacktrace; else gradle assembleDebug connectedDebugAndroidTest --stacktrace; fi
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.amb8657.websitebuilder || true
            adb shell monkey -p com.amb8657.websitebuilder 1
            sleep 3
            adb shell dumpsys activity activities | grep -q 'com.amb8657.websitebuilder/.WebsiteBuilderV4Activity'
            adb exec-out screencap -p > v4-launch.png

            # Capture logs by application UID rather than PID. Android may recycle or
            # briefly omit the process PID even though the launched activity is valid.
            APP_UID=$(adb shell dumpsys package com.amb8657.websitebuilder | sed -n 's/.*userId=\([0-9][0-9]*\).*/\1/p' | head -1 | tr -d '\r')
            test -n "$APP_UID"
            adb logcat --uid="$APP_UID" -d > v4-logcat.txt
            ! grep -qE 'FATAL EXCEPTION|Process: com\.amb8657\.websitebuilder' v4-logcat.txt
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-qa-evidence-${{ github.run_number }}
          path: |
            v4-launch.png
            v4-logcat.txt
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
