name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Gmail branding and stable signing
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/res/drawable "$HOME/.android" app/src/main/assets
          if [ ! -s app/src/main/assets/stable-debug.keystore.b64 ]; then
            keytool -genkeypair -v -keystore /tmp/stable-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,OU=Android,O=Android,L=Mountain View,ST=California,C=US" >/tmp/keytool.log 2>&1
            base64 -w0 /tmp/stable-debug.keystore > app/src/main/assets/stable-debug.keystore.b64
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/assets/stable-debug.keystore.b64
            git commit -m 'Persist stable APK signing key [skip ci]'
            git push
          fi
          base64 -d app/src/main/assets/stable-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          base64 -d app/src/main/assets/gmail.jpg.b64 > app/src/main/res/drawable/gmail.jpg
      - name: Build V4 release APK
        run: gradle --no-daemon clean assembleRelease --stacktrace
      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 4 "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: WebsiteBuilder-V4-final-apk
          path: app/build/outputs/apk/release/app-release.apk
