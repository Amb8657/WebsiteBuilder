name: Fix showCode v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-showcode-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair literal backslash-n sequences
        shell: bash
        run: |
          set -e
          FILE='app/src/main/java/com/amb8657/websitebuilder/MainActivity.java'
          perl -0pi -e 's/\\n/\n/g' "$FILE"
          if grep -qF '\\n' "$FILE"; then
            echo 'ERROR: literal backslash-n sequences remain'
            exit 1
          fi
          git diff -- "$FILE"
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/amb8657/websitebuilder/MainActivity.java
          if git diff --cached --quiet; then echo 'No source change'; exit 0; fi
          git commit -m 'Repair malformed Java newline sequences'
          git push
