name: Fix showCode v2
on:
  push:
    paths:
      - '.github/workflows/fix-showcode-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Java source with real newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/amb8657/websitebuilder/MainActivity.java')
          s = p.read_text()
          if 'void showCode()' in s:
              print('showCode already exists')
              raise SystemExit(0)
          lines = [
              '',
              ' void showCode(){',
              '  LinearLayout box=new LinearLayout(this);',
              '  box.setOrientation(LinearLayout.VERTICAL);',
              '  box.setPadding(dp(16),dp(10),dp(16),dp(8));',
              '  TextView title=tv("Generated HTML for the current draft",13,TEXT);',
              '  box.addView(title,lp(-1,40));',
              '  EditText code=new EditText(this);',
              '  code.setText(pageHtml(pages.get(current)));',
              '  code.setTextColor(TEXT);',
              '  code.setTextSize(11);',
              '  code.setGravity(Gravity.TOP);',
              '  box.addView(code,new LinearLayout.LayoutParams(-1,0,1));',
              '  LinearLayout row=new LinearLayout(this);',
              '  Button close=btn("Close");',
              '  row.addView(close,weight(1,44));',
              '  box.addView(row);',
              '  Dialog d=new Dialog(this);',
              '  d.setContentView(box);',
              '  close.setOnClickListener(v->d.dismiss());',
              '  d.show();',
              '  Window w=d.getWindow();',
              '  if(w!=null){w.setLayout(-1,(int)(getResources().getDisplayMetrics().heightPixels*.8));}',
              ' }',
              ''
          ]
          method = chr(10).join(lines)
          pos = s.rfind(chr(10) + '}')
          if pos < 0:
              raise SystemExit('MainActivity closing brace not found')
          p.write_text(s[:pos] + method + s[pos:])
          PY
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/amb8657/websitebuilder/MainActivity.java
          if git diff --cached --quiet; then echo 'No source change'; exit 0; fi
          git commit -m 'Fix showCode with valid Java source'
          git push
