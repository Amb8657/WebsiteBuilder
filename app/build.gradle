plugins { id 'com.android.application' }

android {
    namespace 'com.amb8657.websitebuilder'
    compileSdk 35
    defaultConfig {
        applicationId 'com.amb8657.websitebuilder'
        minSdk 23
        targetSdk 35
        versionCode (project.findProperty('versionCode') ?: '2').toInteger()
        versionName (project.findProperty('versionName') ?: '1.0.1')
    }
    signingConfigs {
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}
