plugins { id 'com.android.application' }

android {
    namespace 'com.amb8657.websitebuilder'
    compileSdk 35
    defaultConfig {
        applicationId 'com.amb8657.websitebuilder'
        minSdk 23
        targetSdk 35
        versionCode = providers.gradleProperty('versionCode').orElse('2').get().toInteger()
        versionName = providers.gradleProperty('versionName').orElse('1.0.1').get()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            // Android Gradle Plugin automatically uses the standard debug keystore.
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
