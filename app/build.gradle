plugins { id 'com.android.application' }

android {
    namespace 'com.amb8657.websitebuilder'
    compileSdk 35
    defaultConfig {
        applicationId 'com.amb8657.websitebuilder'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}
